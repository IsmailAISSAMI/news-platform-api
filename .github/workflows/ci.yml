name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The Postgres credentials below are literal on purpose: this is a throwaway CI-only
    # database on the runner, it holds no data and is never exposed. Not a secret.
    services:
      postgres:
        image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://news:ci-password@localhost:5432/news
      # Backup/restore tests must run (not skip) in CI: they need pg_dump 18, installed below.
      REQUIRE_BACKUP_TESTS: "1"
      # Use the host pg tools (installed below), not `docker compose exec`.
      PG_TOOLS_COMMAND: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install PostgreSQL 18 client (pg_dump/pg_restore for the backup tests)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version

      - name: Install dependencies
        run: uv sync --locked

      - name: Repository hygiene
        run: uv run python scripts/check_repo_hygiene.py

      - name: pre-commit hooks (ruff, file checks, gitleaks, mypy)
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests alembic

      - name: Migrations are applied and in sync with the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        run: uv run pytest
