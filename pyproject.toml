[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "news-backend"
version = "0.1.0"
description = "Enterprise-grade FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "defusedxml>=0.7,<1",
]

[project.scripts]
news = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "ASYNC",    # blocking calls in async code
    "SIM",      # simplifications
    "RUF",      # ruff-specific
    "C4",       # comprehensions
    "PTH",      # pathlib
    "N",        # naming
    "PL",       # pylint
    "FAST",     # FastAPI
    "A",        # builtin shadowing
    "T20",      # no print()
]

[tool.ruff.lint.per-file-ignores]
# S311: seeded RNGs for determinism. PLR0913/PLR0917: pytest injects fixtures as arguments.
"tests/**" = ["S101", "PLR2004", "S311", "PLR0913", "PLR0917"]
# Generated migrations are frozen snapshots: keep autogenerated lines as-is.
"alembic/versions/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --tb=short: long tracebacks print function arguments, which can include DB credentials.
addopts = "--strict-markers --tb=short --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a running PostgreSQL database"]
filterwarnings = [
    "error",
    # Third-party deprecation: Starlette's TestClient is moving from httpx to httpx2.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.report]
fail_under = 80
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.13"
strict = true
