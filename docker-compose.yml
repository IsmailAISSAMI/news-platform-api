services:
  # The app's database is on Neon (docs/architecture.md 5.6). This local PostgreSQL is
  # for the test suite only: tests create `<db>_test` here (TEST_DATABASE_URL) and never
  # touch Neon.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only; 5433 avoids clashing with other local Postgres instances.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18+ stores data in a versioned subdirectory of /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional: the read-only API in a container, connected to Neon. Migrations are run by
  # the owner from the Mac (`uv run alembic upgrade head`), never by this service.
  api:
    build: .
    image: news-backend:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # IPs of the reverse proxy allowed to set X-Forwarded-* (read by uvicorn).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
